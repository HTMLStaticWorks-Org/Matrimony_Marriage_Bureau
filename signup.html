<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8F1DC" />
    <meta
      name="description"
      content="Sutram — thoughtful matchmaking and meaningful connections."
    />
    <title>Sutram | signup</title>
    <link rel="icon" type="image/png" href="assets/images/sutram-logo.png" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="auth-page">
    <div id="app">
      <div class="auth-shell">
        <div class="auth-tools">
          <button
            class="icon-btn theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Toggle theme"
          >
            ☾</button
          ><button
            class="icon-btn dir-toggle"
            id="dirToggle"
            type="button"
            aria-label="Toggle text direction"
          >
            RTL
          </button>
        </div>
        <form class="auth-card" id="authForm">
          <a class="brand" href="index.html" aria-label="Sutram home"
            ><img src="assets/images/sutram-logo.png" alt="Sutram"
          /></a>
          <h1>Create your Sutram account</h1>
          <p style="text-align: center; color: var(--muted)">
            Start with the details you are comfortable sharing.
          </p>
          <div class="field">
            <label>Full name</label
            ><input required name="name" autocomplete="name" />
          </div>
          <div class="field">
            <label>Email address</label
            ><input required type="email" name="email" autocomplete="email" />
          </div>
          <div class="field">
            <label>Mobile number</label
            ><input required type="tel" name="phone" autocomplete="tel" />
          </div>
          <div class="field">
            <label>Password</label>
            <div class="pwd-wrap">
              <input
                required
                type="password"
                name="password"
                minlength="8"
                autocomplete="new-password"
              /><button
                class="pwd-toggle"
                type="button"
                aria-label="Toggle password visibility"
                title="Show password"
              ></button>
            </div>
          </div>
          <div class="field">
            <label>Confirm password</label>
            <div class="pwd-wrap">
              <input
                required
                type="password"
                name="confirmPassword"
                minlength="8"
                autocomplete="new-password"
              /><button
                class="pwd-toggle"
                type="button"
                aria-label="Toggle confirm password visibility"
                title="Show password"
              ></button>
            </div>
          </div>
          <label style="font-size: 15px; color: var(--muted)"
            ><input type="checkbox" required /> I agree to the privacy notice
            and terms (add approved policy links before launch).</label
          ><button class="btn btn-primary" type="submit">Create account</button>
          <div class="auth-divider"><span>or continue with</span></div>
          <div class="oauth-btns">
            <button
              class="btn btn-ghost oauth-btn"
              type="button"
              data-provider="Google"
            >
              <span class="google-icon" aria-hidden="true"></span>
              Google</button
            ><button
              class="btn btn-ghost oauth-btn"
              type="button"
              data-provider="Apple"
            >
              <span class="apple-icon" aria-hidden="true"></span> Apple
            </button>
          </div>
          <p
            id="authFeedback"
            style="color: var(--muted); font-size: 15px; text-align: center"
          >
            Front-end preview only. Secure authentication is not connected.
          </p>
          <p style="text-align: center; font-size: 16px; margin-bottom: 0">
            Already a member?
            <a style="color: var(--red)" href="login.html">Login</a>
          </p>
        </form>
      </div>
    </div>
    <script src="assets/js/site.js"></script>
  </body>
</html>
